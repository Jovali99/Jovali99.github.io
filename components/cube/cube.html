<div class="cube_container">

      <button
        class="cube_button"
        type="button"
        onclick="cubeButtonClicked('front')"
      >
        front
      </button>
    </div>
    <div class="face back">
      <button
        class="cube_button"
        type="button"
        onclick="cubeButtonClicked('back')"
      >

    <div class="face right">

    <div class="face left">

        type="button"

      >

      </button>
    </div>
    <div class="face top">
      <button
        class="cube_button"
        type="button"
        onclick="cubeButtonClicked('top')"
      >

    <div class="face bottom">
      <button
